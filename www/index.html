<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sisky</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        /* Tela de loading (splash) */
        .splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .splash-logo {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Tela de setup */
        .setup {
            display: none;
            background: #f4f4f5;
            min-height: 100vh;
            width: 100%;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .setup.visible {
            display: flex;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 6px;
            color: #111;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 36px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #444;
        }

        .input-group {
            display: flex;
            align-items: center;
            border: 1.5px solid #e4e4e7;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .input-group:focus-within {
            border-color: #111;
        }

        .input-group.error {
            border-color: #ef4444;
        }

        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            padding: 14px 16px;
            font-size: 16px;
            background: transparent;
            color: #111;
        }

        .input-group .suffix {
            padding: 14px 16px 14px 0;
            font-size: 13px;
            color: #888;
            white-space: nowrap;
        }

        .error-msg {
            color: #ef4444;
            font-size: 12px;
            margin-top: 8px;
            min-height: 18px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 28px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            background: #333;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <!-- Splash / Loading -->
    <div class="splash" id="splash">
        <div class="splash-logo">S</div>
        <div class="splash-spinner"></div>
    </div>

    <!-- Setup -->
    <div class="setup" id="setup">
        <div class="card">
            <div class="logo">Sisky</div>
            <p class="subtitle">Configure seu acesso para começar</p>
            <label for="subdomain">Subdomínio da sua empresa</label>
            <div class="input-group" id="inputGroup">
                <input type="text" id="subdomain" placeholder="suaempresa" autocomplete="off" autocorrect="off"
                    autocapitalize="none" spellcheck="false" inputmode="url" />
                <span class="suffix">.sisky.com.br</span>
            </div>
            <p class="error-msg" id="errorMsg"></p>
            <button id="btn">Entrar</button>
        </div>
    </div>

    <script>
        var input = document.getElementById('subdomain');
        var btn = document.getElementById('btn');
        var errorMsg = document.getElementById('errorMsg');
        var inputGroup = document.getElementById('inputGroup');
        var splash = document.getElementById('splash');
        var setup = document.getElementById('setup');

        // Verifica subdomínio salvo
        var saved = null;
        if (window.Android) {
            saved = window.Android.getSavedSubdomain();
        }
        if (!saved || saved === '') {
            saved = localStorage.getItem('sisky_subdomain');
        }

        if (saved && saved !== '') {
            // Tem subdomínio → mostra splash e navega
            if (window.Android) {
                window.Android.navigateTo('https://' + saved + '.sisky.com.br');
            } else {
                window.location.href = 'https://' + saved + '.sisky.com.br';
            }
        } else {
            // Sem subdomínio → mostra tela de setup
            splash.style.display = 'none';
            setup.classList.add('visible');
        }

        btn.addEventListener('click', handleSubmit);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleSubmit();
        });
        input.addEventListener('input', function () {
            errorMsg.textContent = '';
            inputGroup.classList.remove('error');
        });

        async function handleSubmit() {
            var subdomain = input.value.trim().toLowerCase();

            if (!subdomain) {
                showError('Digite o subdomínio da sua empresa.');
                return;
            }

            if (!/^[a-z0-9-]+$/.test(subdomain)) {
                showError('Use apenas letras minúsculas, números e hífens.');
                return;
            }

            setLoading(true);

            try {
                var url = 'https://' + subdomain + '.sisky.com.br/api/tenant/resolve';

                var result = await window.Capacitor.Plugins.CapacitorHttp.request({
                    method: 'GET',
                    url: url,
                    headers: {
                        'X-Tenant-Subdomain': subdomain
                    }
                });

                if (result.status === 200) {
                    localStorage.setItem('sisky_subdomain', subdomain);
                    if (window.Android) {
                        window.Android.setSubdomain(subdomain);
                    } else {
                        window.location.href = 'https://' + subdomain + '.sisky.com.br';
                    }
                } else if (result.status === 404) {
                    showError('Subdomínio não encontrado. Verifique e tente novamente.');
                } else {
                    showError('Erro ' + result.status + ' ao conectar.');
                }
            } catch (e) {
                showError('Erro: ' + e.message);
            } finally {
                setLoading(false);
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            inputGroup.classList.add('error');
        }

        function setLoading(loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<span class="spinner"></span>Verificando...'
                : 'Entrar';
        }
    </script>
</body>

</html>
